services:
  db:
    image: postgres:16-alpine
    container_name: medicare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-medicare}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port mapping: Postgres is only reachable by the app over the
    # internal compose network (hostname "db"). Never expose the DB to the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-app
    restart: unless-stopped
    ports:
      # Bind to localhost only — nginx (on the same host) proxies to it.
      # Not reachable from outside the instance.
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medicare}
      JWT_SECRET: ${JWT_SECRET:-medicare_super_secret_key_123}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
