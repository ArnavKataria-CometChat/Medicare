services:
  db:
    image: postgres:16-alpine
    container_name: medicare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-medicare}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port mapping: Postgres is only reachable by the app over the
    # internal compose network (hostname "db"). Never expose the DB to the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-app
    restart: unless-stopped
    ports:
      # Bind to all interfaces so local network IP is accessible.
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medicare}
      JWT_SECRET: ${JWT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      COMETCHAT_APP_ID: ${COMETCHAT_APP_ID:-}
      COMETCHAT_REGION: ${COMETCHAT_REGION:-}
      COMETCHAT_AUTH_KEY: ${COMETCHAT_AUTH_KEY:-}
      COMETCHAT_REST_API_KEY: ${COMETCHAT_REST_API_KEY:-}
      COMETCHAT_WEBHOOK_SECRET: ${COMETCHAT_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
