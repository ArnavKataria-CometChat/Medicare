# MediCare — nginx reverse proxy
# Place this file at: /etc/nginx/sites-available/medicare.conf
# Then enable it:     sudo ln -s /etc/nginx/sites-available/medicare.conf /etc/nginx/sites-enabled/
# (On Amazon Linux / RHEL, drop it in /etc/nginx/conf.d/medicare.conf instead.)
#
# The MediCare app (Node/Express, serving the built React SPA + /api + /socket.io)
# listens on 127.0.0.1:5000 via docker-compose. nginx terminates client traffic
# on port 80/443 and forwards everything to the app.

upstream medicare_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or the instance's public/private DNS name.
    # Use "_" to match any host if you don't have a domain yet.
    server_name _;

    # Allow larger uploads (health record PDFs/images). Adjust as needed.
    client_max_body_size 25M;

    # WebSocket / Socket.io — must come before the generic location block.
    location /socket.io/ {
        proxy_pass http://medicare_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API, uploads, SPA, and everything else.
    location / {
        proxy_pass http://medicare_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ---------------------------------------------------------------------------
# OPTIONAL: HTTPS with a domain + Let's Encrypt (certbot).
# After running `sudo certbot --nginx -d your-domain.com`, certbot rewrites the
# block above to redirect 80 -> 443 and adds the TLS server block automatically.
# No manual SSL edits are usually needed.
# ---------------------------------------------------------------------------
