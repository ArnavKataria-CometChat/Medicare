# MediCare — nginx reverse proxy
# Place this file at: /etc/nginx/sites-available/medicare.conf
# Then enable it:     sudo ln -s /etc/nginx/sites-available/medicare.conf /etc/nginx/sites-enabled/
# (On Amazon Linux / RHEL, drop it in /etc/nginx/conf.d/medicare.conf instead.)
#
# The MediCare app (Node/Express, serving the built React SPA + /api + /socket.io)
# listens on 127.0.0.1:5000 via docker-compose. nginx terminates client traffic
# on port 80/443 and forwards everything to the app.

upstream medicare_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Behind an AWS ALB, TLS is terminated at the load balancer and the ALB forwards
# the original client protocol in X-Forwarded-Proto. Honor it if present, and
# fall back to nginx's own scheme for direct (non-ALB) traffic.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;

    # Domain served by this app (behind the AWS ALB).
    server_name medicare.cometchat-staging.com;

    # Allow larger uploads (health record PDFs/images). Adjust as needed.
    client_max_body_size 25M;

    # WebSocket / Socket.io — must come before the generic location block.
    location /socket.io/ {
        proxy_pass http://medicare_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API, uploads, SPA, and everything else.
    location / {
        proxy_pass http://medicare_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Connection "";
    }
}

# ---------------------------------------------------------------------------
# TLS NOTE: SSL/TLS is terminated at the AWS ALB using the *.cometchat-staging.com
# wildcard certificate. The ALB forwards plain HTTP to this nginx on port 80, so
# no certificate or 443 listener is configured here. The X-Forwarded-Proto header
# (mapped above) carries the original https scheme through to the app.
# ---------------------------------------------------------------------------

